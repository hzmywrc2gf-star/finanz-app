<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Darstellung vor dem ersten Rendern setzen (kein Aufblitzen); Key wie in src/lib/theme.ts
      try {
        var t = localStorage.getItem('finanz-app:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F6F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Finanzklar" />
    <title>Finanzklar</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="privacy-cover" aria-hidden="true"><img src="./icon-192.png" alt="" width="96" height="96" /></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
